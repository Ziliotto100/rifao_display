<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Rifon no Telon — Entrar</title>
<meta name="theme-color" content="#2F3A2E">
<link rel="icon" href="icons/icon-192.png">
<meta name="robots" content="noindex">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #2F3A2E;
    color: #F3EFE6;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 60px;
  }
  .logo { height: 90px; margin-bottom: 8px; }
  h1 {
    font-size: 18px;
    color: #C7A26A;
    margin: 4px 0 2px;
    text-align: center;
  }
  .subtitle {
    color: #F3EFE699;
    font-size: 13px;
    text-align: center;
    margin-bottom: 24px;
  }
  .card {
    width: 100%;
    max-width: 400px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
  }
  label {
    display: block;
    font-size: 12px;
    color: #F3EFE699;
    margin-bottom: 4px;
    margin-top: 12px;
  }
  label:first-child { margin-top: 0; }
  input[type="email"], input[type="password"], input[type="tel"], input[type="text"] {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.06);
    color: #F3EFE6;
    font-size: 16px;
  }
  input:focus { outline: none; border-color: #C7A26A; }
  button {
    font-family: inherit;
    cursor: pointer;
  }
  .btn-primary {
    width: 100%;
    margin-top: 18px;
    padding: 13px;
    border-radius: 10px;
    border: none;
    background: #C7A26A;
    color: #1E241C;
    font-size: 15px;
    font-weight: 700;
  }
  .btn-primary:disabled { opacity: 0.6; }
  .btn-secondary {
    width: 100%;
    padding: 11px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.25);
    background: transparent;
    color: #F3EFE6CC;
    font-size: 13px;
    font-weight: 600;
    margin-top: 8px;
  }
  .btn-danger {
    border-color: #E0A0A0;
    color: #E0A0A0;
  }
  .error-box {
    margin-top: 14px;
    padding: 10px 12px;
    border-radius: 10px;
    background: rgba(224,160,160,0.12);
    border: 1px solid #E0A0A0;
    color: #E0A0A0;
    font-size: 13px;
  }
  .hidden { display: none !important; }

  /* ---- Painel logado ---- */
  .panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 4px;
  }
  .community-name { font-size: 16px; font-weight: 700; color: #F3EFE6; }
  .prize-badge {
    background: rgba(199,162,106,0.18);
    border: 1px solid #C7A26A;
    color: #C7A26A;
    border-radius: 20px;
    padding: 3px 12px;
    font-size: 12px;
    font-weight: 700;
    white-space: nowrap;
  }
  .current-row {
    display: flex;
    gap: 10px;
    margin-top: 16px;
  }
  .live-toggle-row {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(255,255,255,0.05);
    border-radius: 10px;
    padding: 10px 12px;
    margin-top: 4px;
    font-size: 13px;
    color: #F3EFE6CC;
  }
  .live-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #6b6b6b;
    flex-shrink: 0;
  }
  .live-dot.on { background: #E05A5A; box-shadow: 0 0 6px #E05A5A; }
  #liveLabel { flex: 1; }
  .live-switch { position: relative; display: inline-block; width: 42px; height: 24px; }
  .live-switch input { opacity: 0; width: 0; height: 0; }
  .live-switch-track {
    position: absolute; inset: 0;
    background: rgba(255,255,255,0.2);
    border-radius: 999px;
    transition: background .15s;
  }
  .live-switch-thumb {
    position: absolute;
    top: 3px; left: 3px;
    width: 18px; height: 18px;
    background: #F3EFE6;
    border-radius: 50%;
    transition: transform .15s;
  }
  .live-switch input:checked + .live-switch-track { background: #C7A26A; }
  .live-switch input:checked + .live-switch-track .live-switch-thumb { transform: translateX(18px); }
  .current-row input { flex: 1; text-align: center; font-size: 22px; font-weight: 700; letter-spacing: 1px; }
  .confirm-btn {
    padding: 0 20px;
    border-radius: 10px;
    border: none;
    background: #C7A26A;
    color: #1E241C;
    font-weight: 800;
    font-size: 15px;
  }
  .confirm-btn:disabled { opacity: 0.5; }
  .dup-warning {
    margin-top: 10px;
    padding: 8px 10px;
    border-radius: 8px;
    background: rgba(224,160,160,0.12);
    border: 1px solid #E0A0A0;
    color: #E0A0A0;
    font-size: 12px;
  }
  .actions-row { display: flex; gap: 8px; margin-top: 14px; }
  .actions-row .btn-secondary { margin-top: 0; }

  .history-title { font-size: 13px; color: #F3EFE699; margin: 6px 0 10px; }
  .history-item {
    display: flex;
    justify-content: space-between;
    padding: 10px 12px;
    background: rgba(255,255,255,0.04);
    border-radius: 10px;
    margin-bottom: 6px;
    font-size: 14px;
  }
  .history-item .p { color: #F3EFE699; }
  .history-item .n { font-weight: 800; }
  .history-empty { color: #F3EFE666; font-size: 13px; text-align: center; padding: 10px 0; }

  .share-box { text-align: center; }
  .share-link {
    word-break: break-all;
    font-size: 12px;
    color: #F3EFE6AA;
    margin-top: 8px;
    display: block;
  }
  .share-qr { margin-top: 12px; border-radius: 10px; background: #fff; padding: 8px; display: inline-block; }
  .share-qr img { display: block; width: 140px; height: 140px; }

  .status-line {
    font-size: 12px;
    text-align: center;
    color: #F3EFE699;
    margin-top: 10px;
  }
  .status-line.offline { color: #E0A0A0; }

  /* ---- Painel de admin ---- */
  .section-title {
    width: 100%; max-width: 400px; font-size: 13px; font-weight: 700; color: #F3EFE699;
    text-transform: uppercase; letter-spacing: .04em; margin: 8px 0 10px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .op-item {
    width: 100%; max-width: 400px; background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1); border-radius: 14px;
    padding: 14px 16px; margin-bottom: 10px;
  }
  .op-head { display: flex; justify-content: space-between; align-items: center; }
  .op-name { font-size: 15px; font-weight: 700; }
  .op-sub { font-size: 12px; margin-top: 3px; }
  .op-sub.ok { color: #7EC790; }
  .op-sub.warn { color: #E0B060; }
  .op-sub.danger { color: #E0A0A0; }
  .op-actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .op-actions .btn-secondary { width: auto; margin-top: 0; padding: 9px 14px; }
  .empty-state { color: #F3EFE666; font-size: 13px; text-align: center; padding: 20px 0; }

  .day-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .day-chip {
    padding: 7px 14px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.06); color: #F3EFE6AA; font-size: 13px; font-weight: 600;
  }
  .day-chip.selected { background: #C7A26A; border-color: #C7A26A; color: #1E241C; }

  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.7);
    display: none; align-items: center; justify-content: center; padding: 20px; z-index: 50;
  }
  .overlay.show { display: flex; }
  .overlay .card { max-height: 85vh; overflow-y: auto; margin-bottom: 0; }

  .toolbar { width: 100%; max-width: 400px; display: flex; justify-content: flex-end; margin-bottom: 8px; }
</style>
</head>
<body>
  <img class="logo" src="logo.png" alt="Rifon no Telon">
  <h1>Entrar</h1>
  <div class="subtitle">Organizador ou administrador — faça login pra continuar.</div>

  <!-- ---------- Tela de login ---------- -->
  <div class="card" id="loginCard">
    <label for="loginEmail">E-mail</label>
    <input type="email" id="loginEmail" autocomplete="username" placeholder="sua@comunidade.com">
    <label for="loginPassword">Senha</label>
    <input type="password" id="loginPassword" autocomplete="current-password" placeholder="••••••••">
    <button class="btn-primary" id="loginBtn" type="button">Entrar</button>
    <div class="error-box hidden" id="loginError"></div>
  </div>

  <!-- ---------- Painel (logado) ---------- -->
  <div class="card hidden" id="panelCard">
    <div class="panel-header">
      <div class="community-name" id="communityName">Comunidade</div>
      <div class="prize-badge" id="prizeBadge">Prêmio 00</div>
    </div>

    <div class="live-toggle-row" id="liveToggleRow">
      <span class="live-dot" id="liveDot"></span>
      <span id="liveLabel">Fora do ar</span>
      <label class="live-switch">
        <input type="checkbox" id="liveToggle">
        <span class="live-switch-track"><span class="live-switch-thumb"></span></span>
      </label>
    </div>

    <label for="numberInput">Número sorteado</label>
    <div class="current-row">
      <input type="tel" id="numberInput" placeholder="Ex: 1996" maxlength="5" inputmode="numeric">
      <button class="confirm-btn" id="confirmBtn" type="button">OK</button>
    </div>
    <div class="dup-warning hidden" id="dupWarning">Esse número já saiu antes!</div>

    <div class="actions-row">
      <button class="btn-secondary" id="undoBtn" type="button" style="flex:1;">↩ Desfazer último</button>
      <button class="btn-secondary btn-danger" id="resetBtn" type="button" style="flex:1;">Reiniciar</button>
    </div>
  </div>

  <div class="card hidden" id="historyCard">
    <div class="history-title">Números sorteados</div>
    <div id="historyList"><div class="history-empty">Nenhum número ainda.</div></div>
  </div>

  <div class="card hidden" id="shareCard">
    <div class="history-title">Link/QR pra plateia</div>
    <div class="share-box">
      <div class="share-qr"><img id="shareQrImg" alt="QR Code"></div>
      <span class="share-link" id="shareLink"></span>
      <button class="btn-secondary" id="copyLinkBtn" type="button">Copiar link</button>
    </div>
  </div>

  <div class="card hidden" id="logoutCard">
    <button class="btn-secondary" id="logoutBtn" type="button">Sair da conta</button>
  </div>

  <!-- ---------- Painel de ADMIN (logado como admin) ---------- -->
  <div class="hidden" id="adminPanelWrap" style="width:100%; max-width:400px;">
    <div class="toolbar">
      <button class="btn-secondary" id="adminLogoutBtn" type="button" style="width:auto;">Sair</button>
    </div>
    <div class="section-title">
      <span>Comunidades</span>
      <button class="btn-secondary" id="newCommunityBtn" type="button" style="width:auto;">+ Nova comunidade</button>
    </div>
    <div id="opsList"><div class="empty-state">Carregando...</div></div>
  </div>

  <!-- Modal: nova comunidade -->
  <div class="overlay" id="createOverlay">
    <div class="card">
      <h1 style="margin-top:0;">Nova comunidade</h1>
      <label for="newCommunity">Nome da comunidade</label>
      <input type="text" id="newCommunity">
      <label for="newEmail">E-mail de login</label>
      <input type="email" id="newEmail">
      <label for="newPassword">Senha (mín. 6 caracteres)</label>
      <input type="password" id="newPassword">
      <label>Dias de acesso</label>
      <div class="day-chips" id="createDayChips"></div>
      <button class="btn-primary" id="createSubmitBtn" type="button">Criar</button>
      <button class="btn-secondary" id="createCancelBtn" type="button">Cancelar</button>
      <div class="error-box hidden" id="createError"></div>
    </div>
  </div>

  <!-- Modal: validade -->
  <div class="overlay" id="renewOverlay">
    <div class="card">
      <h1 style="margin-top:0;" id="renewTitle">Validade</h1>
      <p id="renewCurrent" style="color:#F3EFE699; font-size:13px;"></p>
      <label>Renovar a partir de hoje por:</label>
      <div class="day-chips" id="renewDayChips"></div>
      <button class="btn-primary" id="renewSubmitBtn" type="button">Salvar</button>
      <button class="btn-secondary" id="renewCancelBtn" type="button">Cancelar</button>
      <div class="error-box hidden" id="renewError"></div>
    </div>
  </div>

  <div class="status-line" id="statusLine"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
  import {
    getFirestore, doc, getDoc, getDocs, collection, setDoc, updateDoc
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  // Mesmos dados do lib/services/firebase_config.dart do app Windows.
  const firebaseConfig = {
    apiKey: "AIzaSyCHVXPaawNE_QV_3tzAzCNwyTj0mHAJ8tc",
    projectId: "rifao-eventos",
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const $ = (id) => document.getElementById(id);
  const loginCard = $('loginCard');
  const panelCard = $('panelCard');
  const historyCard = $('historyCard');
  const shareCard = $('shareCard');
  const logoutCard = $('logoutCard');
  const adminPanelWrap = $('adminPanelWrap');
  const statusLine = $('statusLine');

  let entries = []; // mais recente primeiro, igual ao app Windows
  let currentUid = null;
  let currentCommunity = '';
  let liveNow = false;

  function hideAllPanels() {
    panelCard.classList.add('hidden');
    historyCard.classList.add('hidden');
    shareCard.classList.add('hidden');
    logoutCard.classList.add('hidden');
    adminPanelWrap.classList.add('hidden');
  }

  // ---------- LOGIN ----------
  $('loginBtn').addEventListener('click', async () => {
    const email = $('loginEmail').value.trim();
    const password = $('loginPassword').value;
    const errorBox = $('loginError');
    errorBox.classList.add('hidden');

    if (!email || !password) {
      errorBox.textContent = 'Preencha e-mail e senha.';
      errorBox.classList.remove('hidden');
      return;
    }

    $('loginBtn').disabled = true;
    $('loginBtn').textContent = 'Entrando...';
    try {
      await signInWithEmailAndPassword(auth, email, password);
      // onAuthStateChanged cuida do resto (checar se está ativo, o role, etc).
    } catch (e) {
      errorBox.textContent = 'E-mail ou senha incorretos.';
      errorBox.classList.remove('hidden');
    } finally {
      $('loginBtn').disabled = false;
      $('loginBtn').textContent = 'Entrar';
    }
  });

  async function fazerLogout() {
    if (liveNow) {
      liveNow = false;
      await publicarEstado();
    }
    await signOut(auth);
  }
  $('logoutBtn').addEventListener('click', fazerLogout);
  $('adminLogoutBtn').addEventListener('click', fazerLogout);

  // Mesma regra usada no app Windows: precisa estar "active" E, se
  // tiver uma data de validade (expiresAt) definida, ainda não ter
  // vencido.
  function contaLiberada(operatorData) {
    if (operatorData.active !== true) return false;
    if (!operatorData.expiresAt) return true;
    const venceEm = operatorData.expiresAt.toDate
      ? operatorData.expiresAt.toDate()
      : new Date(operatorData.expiresAt);
    return new Date() < venceEm;
  }

  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      loginCard.classList.remove('hidden');
      hideAllPanels();
      currentUid = null;
      entries = [];
      return;
    }

    currentUid = user.uid;

    // Confere se essa conta está liberada (campo "active" em
    // operators/{uid}) — as regras do Firestore também checam isso na
    // escrita, mas aqui dá pra avisar com uma mensagem clara antes.
    let operatorData = null;
    try {
      const opSnap = await getDoc(doc(db, 'operators', user.uid));
      operatorData = opSnap.exists() ? opSnap.data() : null;
    } catch (e) {
      statusLine.textContent = 'Não foi possível confirmar sua conta. Verifique sua internet.';
      statusLine.classList.add('offline');
      return;
    }

    if (!operatorData || !contaLiberada(operatorData)) {
      loginCard.classList.remove('hidden');
      $('loginError').textContent = !operatorData
        ? 'Essa conta ainda não foi liberada. Fale com o suporte.'
        : operatorData.active !== true
          ? 'Sua conta está bloqueada no momento. Fale com o suporte.'
          : 'O acesso dessa comunidade venceu. Fale com o suporte pra renovar.';
      $('loginError').classList.remove('hidden');
      await signOut(auth);
      return;
    }

    loginCard.classList.add('hidden');
    hideAllPanels();

    // O mesmo login serve pra admin e comunidade — o que aparece depois
    // muda de acordo com o "role", igual no app Windows.
    if (operatorData.role === 'admin') {
      adminPanelWrap.classList.remove('hidden');
      logoutCard.classList.remove('hidden');
      await carregarComunidades();
      return;
    }

    panelCard.classList.remove('hidden');
    historyCard.classList.remove('hidden');
    shareCard.classList.remove('hidden');
    logoutCard.classList.remove('hidden');

    currentCommunity = operatorData.community || 'Comunidade';
    $('communityName').textContent = currentCommunity;

    const shareUrl = `${location.origin}${location.pathname.replace('operador.html', 'index.html')}?c=${user.uid}`;
    $('shareLink').textContent = shareUrl;
    $('shareQrImg').src = `https://api.qrserver.com/v1/create-qr-code/?size=280x280&data=${encodeURIComponent(shareUrl)}`;

    await carregarEstadoAtual();
    renderTudo();
  });

  $('copyLinkBtn').addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText($('shareLink').textContent);
      $('copyLinkBtn').textContent = 'Copiado!';
      setTimeout(() => { $('copyLinkBtn').textContent = 'Copiar link'; }, 1500);
    } catch (e) {
      // Sem permissão de clipboard — a pessoa copia manualmente do texto.
    }
  });

  // ---------- Estado do sorteio ----------
  async function carregarEstadoAtual() {
    try {
      const snap = await getDoc(doc(db, 'rifao_live', currentUid));
      if (!snap.exists()) { entries = []; liveNow = false; atualizarSwitchLive(); return; }
      const data = snap.data();
      entries = [];
      if (data.currentNumber) entries.push({ number: data.currentNumber });
      (data.history || [])
        .slice()
        .sort((a, b) => b.prize - a.prize)
        .forEach((h) => entries.push({ number: h.number }));
      liveNow = data.liveNow === true;
      atualizarSwitchLive();
    } catch (e) {
      entries = [];
    }
  }

  function atualizarSwitchLive() {
    $('liveToggle').checked = liveNow;
    $('liveDot').classList.toggle('on', liveNow);
    $('liveLabel').textContent = liveNow
      ? 'Ao vivo — visível pro público agora'
      : 'Fora do ar';
  }

  $('liveToggle').addEventListener('change', async (e) => {
    liveNow = e.target.checked;
    atualizarSwitchLive();
    await publicarEstado();
  });

  async function publicarEstado() {
    const total = entries.length;
    const history = entries.slice(1).map((e, i) => ({
      prize: total - 1 - i,
      number: e.number,
    }));
    // setDoc SEM {merge:true} substitui o documento inteiro — por isso
    // "community" e "liveNow" precisam ir em TODA publicação, senão
    // desaparecem do documento na próxima atualização.
    const body = {
      community: currentCommunity,
      liveNow,
      prizeNumber: total,
      currentNumber: total > 0 ? entries[0].number : null,
      updatedAt: new Date(),
      history,
    };
    try {
      await setDoc(doc(db, 'rifao_live', currentUid), body);
      statusLine.textContent = 'Publicado ✓';
      statusLine.classList.remove('offline');
    } catch (e) {
      statusLine.textContent = 'Sem internet — vai publicar assim que reconectar.';
      statusLine.classList.add('offline');
    }
  }

  function renderTudo() {
    $('prizeBadge').textContent = 'Prêmio ' + String(entries.length).padStart(2, '0');

    const list = $('historyList');
    list.innerHTML = '';
    if (entries.length === 0) {
      list.innerHTML = '<div class="history-empty">Nenhum número ainda.</div>';
    } else {
      entries.forEach((e, i) => {
        const row = document.createElement('div');
        row.className = 'history-item';
        const prize = entries.length - i;
        row.innerHTML =
          '<span class="p">Prêmio ' + String(prize).padStart(2, '0') + '</span>' +
          '<span class="n">' + e.number + '</span>';
        list.appendChild(row);
      });
    }
  }

  $('numberInput').addEventListener('input', () => {
    const valor = $('numberInput').value.trim();
    const jaSaiu = valor && entries.some((e) => e.number === valor);
    $('dupWarning').classList.toggle('hidden', !jaSaiu);
  });

  $('confirmBtn').addEventListener('click', async () => {
    const valor = $('numberInput').value.trim();
    if (!valor) return;
    entries = [{ number: valor }, ...entries];
    $('numberInput').value = '';
    $('dupWarning').classList.add('hidden');
    renderTudo();
    await publicarEstado();
  });

  $('numberInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') $('confirmBtn').click();
  });

  $('undoBtn').addEventListener('click', async () => {
    if (entries.length === 0) return;
    entries = entries.slice(1);
    renderTudo();
    await publicarEstado();
  });

  $('resetBtn').addEventListener('click', async () => {
    if (entries.length === 0) return;
    if (!confirm('Reiniciar o sorteio dessa comunidade? Isso apaga todos os números já publicados.')) return;
    entries = [];
    renderTudo();
    await publicarEstado();
  });

  // ================= PAINEL DE ADMIN =================
  const DAY_OPTIONS = [1, 7, 30, 365];

  async function carregarComunidades() {
    const list = $('opsList');
    list.innerHTML = '<div class="empty-state">Carregando...</div>';
    try {
      const snap = await getDocs(collection(db, 'operators'));
      const ops = [];
      snap.forEach((d) => {
        const data = d.data();
        if (data.role === 'admin') return;
        ops.push({
          uid: d.id,
          community: data.community || '(sem nome)',
          active: data.active === true,
          expiresAt: data.expiresAt ? (data.expiresAt.toDate ? data.expiresAt.toDate() : new Date(data.expiresAt)) : null,
        });
      });
      ops.sort((a, b) => a.community.localeCompare(b.community, 'pt-BR'));
      renderComunidades(ops);
    } catch (e) {
      list.innerHTML = '<div class="empty-state">Erro ao carregar. Tente de novo.</div>';
    }
  }

  function diasRestantes(expiresAt) {
    if (!expiresAt) return null;
    return Math.floor((expiresAt.getTime() - Date.now()) / 86400000);
  }

  function statusInfo(op) {
    if (!op.active) return { text: 'Bloqueada manualmente', cls: 'danger' };
    if (!op.expiresAt) return { text: 'Liberada · sem prazo de validade', cls: 'ok' };
    const dias = diasRestantes(op.expiresAt);
    if (dias < 0) return { text: 'Acesso vencido', cls: 'danger' };
    if (dias === 0) return { text: 'Liberada · vence hoje', cls: 'warn' };
    if (dias <= 5) return { text: `Liberada · vence em ${dias} dia(s)`, cls: 'warn' };
    return { text: `Liberada · vence em ${dias} dia(s)`, cls: 'ok' };
  }

  function renderComunidades(ops) {
    const list = $('opsList');
    if (ops.length === 0) {
      list.innerHTML = '<div class="empty-state">Nenhuma comunidade cadastrada ainda.</div>';
      return;
    }
    list.innerHTML = '';
    ops.forEach((op) => {
      const st = statusInfo(op);
      const item = document.createElement('div');
      item.className = 'op-item';
      item.innerHTML = `
        <div class="op-head">
          <div>
            <div class="op-name">${op.community}</div>
            <div class="op-sub ${st.cls}">${st.text}</div>
          </div>
        </div>
        <div class="op-actions">
          <button class="btn-secondary toggle-active-btn" type="button">${op.active ? '🔓 Bloquear' : '🔒 Liberar'}</button>
          <button class="btn-secondary renew-btn" type="button">📅 Validade</button>
          <button class="btn-secondary btn-danger end-live-btn" type="button">📡 Encerrar transmissão</button>
        </div>
      `;
      item.querySelector('.toggle-active-btn').addEventListener('click', () => toggleActive(op, !op.active));
      item.querySelector('.renew-btn').addEventListener('click', () => openRenewDialog(op));
      item.querySelector('.end-live-btn').addEventListener('click', () => forceEndLive(op));
      list.appendChild(item);
    });
  }

  async function toggleActive(op, novoValor) {
    try {
      await updateDoc(doc(db, 'operators', op.uid), { active: novoValor });
      await carregarComunidades();
    } catch (e) {
      alert('Não foi possível salvar. Tente de novo.');
      await carregarComunidades();
    }
  }

  async function forceEndLive(op) {
    if (!confirm(`Encerrar a transmissão ao vivo de "${op.community}"? Não apaga os números já sorteados.`)) return;
    try {
      await updateDoc(doc(db, 'rifao_live', op.uid), { liveNow: false });
      alert('Transmissão encerrada.');
    } catch (e) {
      // Se a comunidade nunca publicou nada, o documento nem existe —
      // não tem o que encerrar, tudo bem.
    }
  }

  function buildDayChips(container, onSelect, initialValue) {
    container.innerHTML = '';
    const options = [...DAY_OPTIONS, null];
    options.forEach((d) => {
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'day-chip' + (d === initialValue ? ' selected' : '');
      chip.textContent = d === null ? 'Sem prazo' : `${d}d`;
      chip.addEventListener('click', () => {
        container.querySelectorAll('.day-chip').forEach((c) => c.classList.remove('selected'));
        chip.classList.add('selected');
        onSelect(d);
      });
      container.appendChild(chip);
    });
  }

  // ---- Modal: nova comunidade ----
  const createOverlay = $('createOverlay');
  let createSelectedDays = 30;

  $('newCommunityBtn').addEventListener('click', () => {
    $('newCommunity').value = '';
    $('newEmail').value = '';
    $('newPassword').value = '';
    $('createError').classList.add('hidden');
    createSelectedDays = 30;
    buildDayChips($('createDayChips'), (d) => (createSelectedDays = d), 30);
    createOverlay.classList.add('show');
  });
  $('createCancelBtn').addEventListener('click', () => createOverlay.classList.remove('show'));
  createOverlay.addEventListener('click', (e) => { if (e.target === createOverlay) createOverlay.classList.remove('show'); });

  $('createSubmitBtn').addEventListener('click', async () => {
    const community = $('newCommunity').value.trim();
    const email = $('newEmail').value.trim();
    const password = $('newPassword').value;
    const errBox = $('createError');
    errBox.classList.add('hidden');

    if (!community || !email || !password) {
      errBox.textContent = 'Preencha todos os campos.';
      errBox.classList.remove('hidden');
      return;
    }
    if (password.length < 6) {
      errBox.textContent = 'A senha precisa ter pelo menos 6 caracteres.';
      errBox.classList.remove('hidden');
      return;
    }

    $('createSubmitBtn').disabled = true;
    $('createSubmitBtn').textContent = 'Criando...';
    try {
      // Cria a conta de login via REST (accounts:signUp) em vez do SDK,
      // porque o SDK trocaria a sessão logada do navegador (você, admin)
      // pra essa conta nova — a REST não afeta a sessão atual.
      const signUpRes = await fetch(
        `https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${firebaseConfig.apiKey}`,
        {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password, returnSecureToken: true }),
        }
      );
      const signUpData = await signUpRes.json();
      if (!signUpRes.ok) {
        const code = signUpData.error?.message || '';
        throw new Error(
          code.includes('EMAIL_EXISTS') ? 'Já existe uma conta com esse e-mail.' :
          code.includes('WEAK_PASSWORD') ? 'Senha fraca demais.' :
          'Não foi possível criar a conta.'
        );
      }
      const newUid = signUpData.localId;

      const expiresAt = createSelectedDays == null
        ? null
        : new Date(Date.now() + createSelectedDays * 86400000);

      const docData = { community, role: 'community', active: true };
      if (expiresAt) docData.expiresAt = expiresAt;

      await setDoc(doc(db, 'operators', newUid), docData);

      createOverlay.classList.remove('show');
      await carregarComunidades();
    } catch (e) {
      errBox.textContent = e.message || 'Erro ao criar comunidade.';
      errBox.classList.remove('hidden');
    } finally {
      $('createSubmitBtn').disabled = false;
      $('createSubmitBtn').textContent = 'Criar';
    }
  });

  // ---- Modal: validade ----
  const renewOverlay = $('renewOverlay');
  let renewTarget = null;
  let renewSelectedDays = 30;

  function openRenewDialog(op) {
    renewTarget = op;
    $('renewTitle').textContent = `Validade — ${op.community}`;
    $('renewCurrent').textContent = op.expiresAt
      ? `Hoje: vence em ${diasRestantes(op.expiresAt)} dia(s).`
      : 'Hoje: sem prazo de validade definido.';
    $('renewError').classList.add('hidden');
    renewSelectedDays = 30;
    buildDayChips($('renewDayChips'), (d) => (renewSelectedDays = d), 30);
    renewOverlay.classList.add('show');
  }
  $('renewCancelBtn').addEventListener('click', () => renewOverlay.classList.remove('show'));
  renewOverlay.addEventListener('click', (e) => { if (e.target === renewOverlay) renewOverlay.classList.remove('show'); });

  $('renewSubmitBtn').addEventListener('click', async () => {
    if (!renewTarget) return;
    $('renewSubmitBtn').disabled = true;
    try {
      const expiresAt = renewSelectedDays == null
        ? null
        : new Date(Date.now() + renewSelectedDays * 86400000);
      await setDoc(doc(db, 'operators', renewTarget.uid), { expiresAt }, { merge: true });
      renewOverlay.classList.remove('show');
      await carregarComunidades();
    } catch (e) {
      $('renewError').textContent = 'Não foi possível salvar.';
      $('renewError').classList.remove('hidden');
    } finally {
      $('renewSubmitBtn').disabled = false;
    }
  });
</script>
</body>
</html>
