<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Rifon no Telon</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #2F3A2E;
    color: #F3EFE6;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 40px;
  }
  .logo {
    width: min(180px, 45vw);
    height: auto;
    margin-bottom: 20px;
  }
  .prize {
    color: #C7A26A;
    font-weight: 700;
    font-size: clamp(16px, 5vw, 22px);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 8px;
    text-align: center;
  }
  .number {
    color: #C7A26A;
    font-weight: 900;
    font-size: clamp(64px, 26vw, 140px);
    line-height: 1;
    margin: 8px 0 28px;
    transition: color 0.3s, text-shadow 0.3s;
  }
  .number.mine {
    color: #F3EFE6;
    text-shadow: 0 0 24px #C7A26A, 0 0 48px #C7A26A;
    animation: pulse-glow 1.2s ease-in-out infinite;
  }
  @keyframes pulse-glow {
    0%, 100% { text-shadow: 0 0 18px #C7A26A, 0 0 36px #C7A26A; }
    50% { text-shadow: 0 0 32px #C7A26A, 0 0 64px #C7A26A; }
  }
  .history-title {
    color: #F3EFE6AA;
    font-size: 13px;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .history {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .history-item {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 10px;
    padding: 10px 16px;
    transition: background 0.3s, border-color 0.3s;
  }
  .history-item .p { color: #F3EFE699; font-size: 13px; }
  .history-item .n { color: #F3EFE6; font-weight: 700; font-size: 22px; }
  .history-item.mine {
    background: rgba(199,162,106,0.22);
    border-color: #C7A26A;
  }
  .history-item.mine .n::after {
    content: ' 🏆';
  }
  .status {
    margin-top: 32px;
    color: #F3EFE666;
    font-size: 11px;
    text-align: center;
  }
  .status.offline { color: #E0A0A0; }
  .past-wins-banner {
    display: none;
    margin-top: 20px;
    max-width: 420px;
    width: 100%;
    background: rgba(199,162,106,0.18);
    border: 1px solid #C7A26A;
    border-radius: 12px;
    padding: 12px 16px;
    color: #F3EFE6;
    font-size: 14px;
    text-align: center;
    font-weight: 600;
    line-height: 1.5;
  }
  .credit {
    margin-top: 12px;
    text-align: center;
    color: #F3EFE655;
    font-size: 11px;
    line-height: 1.6;
  }

  /* --- Cadastro "Meus números" --- */
  .mynumbers {
    width: 100%;
    max-width: 420px;
    margin-top: 36px;
    padding-top: 24px;
    border-top: 1px solid rgba(255,255,255,0.12);
  }
  .mynumbers-title {
    color: #F3EFE6AA;
    font-size: 13px;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .mynumbers-hint {
    color: #F3EFE666;
    font-size: 11px;
    margin-bottom: 12px;
    line-height: 1.5;
  }
  .mynumbers-form {
    display: flex;
    gap: 8px;
  }
  .mynumbers-form input {
    flex: 1;
    min-width: 0;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 10px;
    padding: 12px 14px;
    color: #F3EFE6;
    font-size: 18px;
    outline: none;
  }
  .mynumbers-form input:focus { border-color: #C7A26A; }
  .mynumbers-form button {
    background: #C7A26A;
    color: #2F3A2E;
    border: none;
    border-radius: 10px;
    padding: 0 18px;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
  }
  .mynumbers-form button:active { opacity: 0.8; }
  .chip-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 14px;
  }
  .chip {
    background: rgba(199,162,106,0.15);
    border: 1px solid rgba(199,162,106,0.45);
    border-radius: 20px;
    padding: 6px 8px 6px 14px;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 6px;
    color: #F3EFE6;
  }
  .chip button {
    background: none;
    border: none;
    color: #F3EFE699;
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    padding: 2px 4px;
  }
  .mynumbers-empty {
    color: #F3EFE644;
    font-size: 12px;
    margin-top: 14px;
    font-style: italic;
  }

  /* --- Overlay de comemoração --- */
  .celebration-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.88);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 24px;
  }
  .celebration-overlay.show { display: flex; }
  .celebration-box {
    text-align: center;
    max-width: 340px;
    animation: pop-in 0.35s ease-out;
  }
  @keyframes pop-in {
    from { transform: scale(0.8); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .celebration-emoji {
    font-size: 56px;
    margin-bottom: 8px;
    animation: bounce 1s ease-in-out infinite;
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }
  .celebration-title {
    color: #C7A26A;
    font-size: 26px;
    font-weight: 900;
    line-height: 1.3;
    margin-bottom: 10px;
  }
  .celebration-sub {
    color: #F3EFE6;
    font-size: 16px;
    margin-bottom: 24px;
  }
  .celebration-sub b { color: #C7A26A; font-size: 20px; }
  .celebration-close {
    background: #C7A26A;
    color: #2F3A2E;
    border: none;
    border-radius: 10px;
    padding: 12px 28px;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
  }
</style>
</head>
<body>
  <img class="logo" src="logo.png" alt="Rifon no Telon">
  <div class="prize" id="prizeLabel">Conectando...</div>
  <div class="number" id="numberDisplay">--</div>
  <div class="history-title">Últimos sorteados</div>
  <div class="history" id="history"></div>
  <div class="status" id="status">Rifon no Telon</div>
  <div class="past-wins-banner" id="pastWinsBanner"></div>

  <div class="mynumbers">
    <div class="mynumbers-title">Meus números</div>
    <div class="mynumbers-hint">
      Cadastre os números que você comprou e a tela avisa aqui quando
      algum deles for sorteado. Fica salvo só neste celular.
    </div>
    <form class="mynumbers-form" id="mynumbersForm">
      <input
        type="tel"
        inputmode="numeric"
        pattern="[0-9]*"
        maxlength="5"
        placeholder="Ex: 1995"
        id="mynumbersInput"
      >
      <button type="submit">Adicionar</button>
    </form>
    <div class="chip-list" id="chipList"></div>
    <div class="mynumbers-empty" id="mynumbersEmpty">
      Nenhum número cadastrado ainda.
    </div>
  </div>

  <div class="credit">
    Desenvolvido por Ziliotto SmartDev
  </div>

  <div class="celebration-overlay" id="celebrationOverlay">
    <div class="celebration-box">
      <div class="celebration-emoji">🎉</div>
      <div class="celebration-title">Seu número foi sorteado!</div>
      <div class="celebration-sub">
        Prêmio Nº <span id="celebrationPrize"></span> · Número
        <b id="celebrationNumber"></b>
      </div>
      <button class="celebration-close" id="celebrationClose">Que demais!</button>
    </div>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getFirestore, doc, onSnapshot
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  // ATENÇÃO: preencha com os mesmos dados do arquivo
  // lib/services/firebase_config.dart do app Windows.
  const firebaseConfig = {
    apiKey: "AIzaSyCHVXPaawNE_QV_3tzAzCNwyTj0mHAJ8tc",
    projectId: "rifao-eventos",
  };

  const COLLECTION = "rifao_live";
  const DOCUMENT = "estado_atual";

  const prizeLabel = document.getElementById('prizeLabel');
  const numberDisplay = document.getElementById('numberDisplay');
  const history = document.getElementById('history');
  const status = document.getElementById('status');
  const pastWinsBanner = document.getElementById('pastWinsBanner');

  // ---------- Meus números (localStorage) ----------
  const STORAGE_KEY = 'rifao_meus_numeros';
  const mynumbersForm = document.getElementById('mynumbersForm');
  const mynumbersInput = document.getElementById('mynumbersInput');
  const chipList = document.getElementById('chipList');
  const mynumbersEmpty = document.getElementById('mynumbersEmpty');

  const celebrationOverlay = document.getElementById('celebrationOverlay');
  const celebrationPrize = document.getElementById('celebrationPrize');
  const celebrationNumber = document.getElementById('celebrationNumber');
  const celebrationClose = document.getElementById('celebrationClose');

  function loadMeusNumeros() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    } catch (e) {
      return [];
    }
  }

  function saveMeusNumeros(lista) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(lista));
  }

  let meusNumeros = loadMeusNumeros();
  let ultimoNumeroComemorado = null;
  let ultimoSnapshotData = null;

  // Compara dois números de rifa ignorando zeros à esquerda, formatação ou
  // espaços — "2", "02" e "002" precisam ser tratados como o mesmo número,
  // já que a pessoa costuma digitar sem os zeros do bilhete.
  function mesmoNumero(a, b) {
    if (a == null || b == null) return false;
    const na = parseInt(String(a).trim(), 10);
    const nb = parseInt(String(b).trim(), 10);
    return !isNaN(na) && !isNaN(nb) && na === nb;
  }

  function numeroEstaCadastrado(numero) {
    return meusNumeros.some((n) => mesmoNumero(n, numero));
  }

  // Mostra só os 5 mais recentes na lista visual (pra não virar uma lista
  // gigante na tela), mas as comparações de "meus números" usam o
  // histórico inteiro que vem do Firestore — veja renderPastWinsBanner.
  function renderHistoryList(historyCompleto) {
    history.innerHTML = '';
    historyCompleto.slice(0, 5).forEach((item) => {
      const row = document.createElement('div');
      const isMine = numeroEstaCadastrado(item.number);
      row.className = 'history-item' + (isMine ? ' mine' : '');
      row.innerHTML =
        '<span class="p">Prêmio ' + String(item.prize).padStart(2, '0') + '</span>' +
        '<span class="n">' + item.number + '</span>';
      history.appendChild(row);
    });
  }

  // Junta os prêmios já ganhos considerando TANTO o número atual em
  // exibição (que ainda não "virou histórico", porque nenhum outro saiu
  // depois dele) QUANTO o histórico completo. Sem isso, quem cadastra
  // justamente o único/último número sorteado até agora não via nenhum
  // aviso, porque esse número ainda não tinha entrado na lista de histórico.
  // Guarda o número sorteado junto com o prêmio (não só o prêmio) pra
  // deixar claro pra pessoa QUAL dos números dela bateu.
  function coletarPremiosGanhos(data) {
    const ganhos = [];
    if (data.currentNumber && numeroEstaCadastrado(data.currentNumber)) {
      ganhos.push({ prize: data.prizeNumber, number: data.currentNumber });
    }
    (data.history || []).forEach((item) => {
      if (numeroEstaCadastrado(item.number)) {
        ganhos.push({ prize: item.prize, number: item.number });
      }
    });
    // Remove duplicados (mesmo prêmio não deve aparecer duas vezes) e
    // ordena pelo número do prêmio.
    const vistos = new Set();
    const unicos = [];
    ganhos.forEach((g) => {
      if (!vistos.has(g.prize)) {
        vistos.add(g.prize);
        unicos.push(g);
      }
    });
    return unicos.sort((a, b) => a.prize - b.prize);
  }

  // Avisa sobre números que já saíram, pra quem chegou atrasado ou está
  // acompanhando de casa não perder a informação — mesmo que o número seja
  // exatamente o que está em exibição agora. Mostra o número do prêmio E
  // o número sorteado, pra ficar claro qual dos números cadastrados bateu.
  function renderPastWinsBanner(data) {
    if (!data) {
      pastWinsBanner.style.display = 'none';
      return;
    }
    const premiosGanhos = coletarPremiosGanhos(data);
    if (premiosGanhos.length === 0) {
      pastWinsBanner.style.display = 'none';
      return;
    }
    const lista = premiosGanhos
      .map((g) => 'Prêmio ' + String(g.prize).padStart(2, '0') + ' (nº ' + g.number + ')')
      .join(', ');
    const plural = premiosGanhos.length > 1 ? 'prêmios' : 'prêmio';
    pastWinsBanner.textContent =
      '🏆 Você foi contemplado no ' + plural + ': ' + lista;
    pastWinsBanner.style.display = 'block';
  }

  // Reaplica as telas acima usando o último snapshot recebido — chamado de
  // novo sempre que a pessoa adiciona ou remove um número cadastrado, pra
  // já avisar na hora se o número cadastrado tardiamente já tinha saído
  // (inclusive se for exatamente o número em exibição agora).
  function atualizarComparacoes() {
    if (!ultimoSnapshotData) return;
    renderHistoryList(ultimoSnapshotData.history || []);
    renderPastWinsBanner(ultimoSnapshotData);
    if (ultimoSnapshotData.currentNumber) {
      checkCelebration(ultimoSnapshotData.currentNumber, ultimoSnapshotData.prizeNumber);
    } else {
      numberDisplay.classList.remove('mine');
    }
  }

  function renderChips() {
    chipList.innerHTML = '';
    mynumbersEmpty.style.display = meusNumeros.length === 0 ? 'block' : 'none';
    meusNumeros.forEach((num) => {
      const chip = document.createElement('div');
      chip.className = 'chip';
      chip.innerHTML = '<span>' + num + '</span>';
      const removeBtn = document.createElement('button');
      removeBtn.type = 'button';
      removeBtn.textContent = '✕';
      removeBtn.addEventListener('click', () => {
        meusNumeros = meusNumeros.filter((n) => n !== num);
        saveMeusNumeros(meusNumeros);
        renderChips();
        atualizarComparacoes();
      });
      chip.appendChild(removeBtn);
      chipList.appendChild(chip);
    });
  }

  mynumbersForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const valor = mynumbersInput.value.trim();
    if (!valor) return;
    if (!numeroEstaCadastrado(valor)) {
      meusNumeros.push(valor);
      saveMeusNumeros(meusNumeros);
      renderChips();
      atualizarComparacoes();
    }
    mynumbersInput.value = '';
    mynumbersInput.focus();
  });

  celebrationClose.addEventListener('click', () => {
    celebrationOverlay.classList.remove('show');
  });

  renderChips();

  // ---------- Firestore ao vivo ----------
  function checkCelebration(numeroAtual, prizeNumber) {
    const numberMatches = numeroAtual && numeroEstaCadastrado(numeroAtual);
    numberDisplay.classList.toggle('mine', !!numberMatches);

    if (numberMatches && numeroAtual !== ultimoNumeroComemorado) {
      ultimoNumeroComemorado = numeroAtual;
      celebrationPrize.textContent = String(prizeNumber).padStart(2, '0');
      celebrationNumber.textContent = numeroAtual;
      celebrationOverlay.classList.add('show');
    }
  }

  try {
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const ref = doc(db, COLLECTION, DOCUMENT);

    onSnapshot(ref, (snap) => {
      status.textContent = 'Rifon no Telon · ao vivo';
      status.classList.remove('offline');

      if (!snap.exists()) {
        prizeLabel.textContent = 'Aguardando o sorteio começar...';
        numberDisplay.textContent = '--';
        numberDisplay.classList.remove('mine');
        history.innerHTML = '';
        pastWinsBanner.style.display = 'none';
        ultimoSnapshotData = null;
        return;
      }

      const data = snap.data();
      ultimoSnapshotData = data;

      if (data.currentNumber) {
        prizeLabel.textContent = 'Prêmio Nº ' + String(data.prizeNumber).padStart(2, '0');
        numberDisplay.textContent = data.currentNumber;
        checkCelebration(data.currentNumber, data.prizeNumber);
      } else {
        prizeLabel.textContent = 'Aguardando o sorteio começar...';
        numberDisplay.textContent = '--';
        numberDisplay.classList.remove('mine');
      }

      renderHistoryList(data.history || []);
      renderPastWinsBanner(data);
    }, (err) => {
      status.textContent = 'Sem conexão com o servidor — tentando de novo...';
      status.classList.add('offline');
    });
  } catch (e) {
    status.textContent = 'Erro de configuração da página. Avise o organizador.';
    status.classList.add('offline');
  }
</script>
</body>
</html>
